services:
  - type: web
    name: civix-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: pnpm install && pnpm build:api
    startCommand: pnpm start:api
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://civix-murex.vercel.app
